# The Workshop's companion script template (docs/workshop.md): one Anchor program per script, which
# the Bordrless companion calls with the companion address signing (`companion_init`,
# `companion_step`). This file, Cargo.lock and the vendored crates (crates/: the launchpad and the
# token standard, with the crates they are built on) are the build worker's; a project only
# supplies src/**.rs.
# Same toolchain and profile as bordrless-programs and the hook template (Anchor 1.2,
# platform-tools v1.57, SBPF v3).

# Its own workspace: never part of the monorepo's.
[workspace]
members = ["."]

[package]
name = "workshop-script"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "workshop_script"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-launch/idl-build", "bordrless-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
# What a script trades and reads with, as libraries (no entrypoint): the launchpad's client (the
# launch's address and keys, the swap on its pool) and state (`Launch`), and the token standard's
# client (holding addresses, `read_holding`, transfers) and state.
bordrless-launch = { path = "crates/bordrless-launch", features = ["no-entrypoint"] }
bordrless-token = { path = "crates/bordrless-token", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
