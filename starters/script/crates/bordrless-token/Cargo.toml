[package]
name = "bordrless-token"
description = "The Bordrless Token Standard, vendored from bordrless-programs/programs/bordrless_token for the Workshop's script template, as a library (no entrypoint): mints, holdings and the client (holding addresses, read_holding, transfers) a script reads and moves tokens with."
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

# A library here (the program's own cdylib is never needed).
[lib]
name = "bordrless_token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = "=1.1.3"
anchor-lang = { version = "=1.2.0", features = ["event-cpi", "init-if-needed"] }
bordrless-hook = { path = "../bordrless-hook" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
