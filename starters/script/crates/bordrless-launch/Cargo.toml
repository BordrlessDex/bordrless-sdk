[package]
name = "bordrless-launch"
description = "The Bordrless launchpad, vendored from bordrless-programs/programs/bordrless_launch for the Workshop's script template, as a library (no entrypoint): the launch's state and the client a script trades on the launch's pool with."
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

# A library here (the program's own cdylib is never needed).
[lib]
name = "bordrless_launch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build", "bordrless-token/idl-build", "bordrless-swap/idl-build", "bordrless-kit/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = "=1.1.3"
anchor-lang = { version = "=1.2.0", features = ["event-cpi"] }
bordrless-core = { path = "../bordrless-core" }
bordrless-hook = { path = "../bordrless-hook" }
bordrless-token = { path = "../bordrless-token", features = ["no-entrypoint"] }
bordrless-swap = { path = "../bordrless-swap", features = ["no-entrypoint"] }
bordrless-kit = { path = "../bordrless-kit", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
